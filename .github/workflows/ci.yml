name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pandas requests pyyaml pytest httpx numpy

      - name: Compile modules
        run: |
          python -m py_compile api_server.py
          python -m py_compile storage/__init__.py
          python -m py_compile collectors/__init__.py
          python -m py_compile processors/__init__.py

      - name: Run tests or smoke test
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --tb=short
          else
            python -c "from api_server import app; print('Backend import OK')"
          fi

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (catches TypeScript errors)
        run: npm run build
